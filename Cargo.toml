[package]
name = "desk_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
# raw-window-handle-06：用于拿到窗口 HWND，把窗口从任务栏隐藏
slint = { version = "1", features = ["raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
display-info = "0.5"
rfd = "0.16"
tray-icon = "0.26"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
